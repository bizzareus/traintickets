services:
  frontend:
    image: ghcr.io/bizzareus/traintickets-frontend:latest
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=https://api.lastberth.com
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.lastberth.com
      - API_URL=https://api.lastberth.com
    extra_hosts:
      - "api.lastberth.com:13.207.130.42"
    ports:
      - "3010:3010"
    volumes:
      # NOTE: do NOT bind-mount ../.next here. The image already contains a
      # fresh production build (COPY --from=builder /app/.next), and a host
      # bind mount shadows it with the stale build from the first deploy —
      # which is why green CI runs never changed the live UI.
      # content/ and public/ stay mounted because the workflow rsyncs them
      # fresh on every deploy.
      - ../content:/app/content:ro
      - ../public:/app/public:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.frontend:/etc/caddy/Caddyfile:ro
      - caddy_frontend_data:/data
      - caddy_frontend_config:/config
      - caddy_frontend_logs:/var/log/caddy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      - frontend

volumes:
  caddy_frontend_data:
  caddy_frontend_config:
  caddy_frontend_logs:
