x-backend-runtime: &backend-runtime
  image: ghcr.io/bizzareus/traintickets-backend:latest
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  env_file:
    - ../backend/.env
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "10"

services:
  backend:
    <<: *backend-runtime
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      NODE_OPTIONS: ${BACKEND_NODE_OPTIONS:---max-old-space-size=450}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    ports:
      - "3009:3009"

  worker:
    <<: *backend-runtime
    command: ["node", "dist/worker.js"]
    environment:
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=450}
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
