name: Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & Push Backend ---
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # --- Build & Push Frontend ---
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.lastberth.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-frontend-aws:
    name: Deploy Frontend (AWS EC2 - Next.js)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Get Runner IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "ipv4=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Authorize Security Group Ingress
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.FRONTEND_SG_ID || 'sg-060d95f99ed1571f9' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_HOST: ${{ secrets.FRONTEND_EC2_HOST || '13.202.107.176' }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            cat << 'EOF_SSH' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 60
            ConnectTimeout 30
          EOF_SSH
            chmod 600 ~/.ssh/config
          fi

      - name: Pull & Deploy Frontend on EC2
        if: env.SSH_PRIVATE_KEY != ''
        env:
          TARGET_HOST: ${{ secrets.FRONTEND_EC2_HOST || '13.202.107.176' }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend:latest
        run: |
          ssh ubuntu@$TARGET_HOST "mkdir -p /home/ubuntu/app/infra"
          scp infra/docker-compose.frontend.yml ubuntu@$TARGET_HOST:/home/ubuntu/app/infra/docker-compose.yml
          scp infra/Caddyfile.frontend ubuntu@$TARGET_HOST:/home/ubuntu/app/infra/Caddyfile.frontend
          
          # Sync public and content directories for volume mounts
          rsync -avz --delete \
            --exclude '.git' \
            ./public/ ubuntu@$TARGET_HOST:/home/ubuntu/app/public/
          rsync -avz --delete \
            --exclude '.git' \
            ./content/ ubuntu@$TARGET_HOST:/home/ubuntu/app/content/

          # Log in to GHCR on EC2, pull image, and restart container fast
          ssh ubuntu@$TARGET_HOST "echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$REGISTRY_USER' --password-stdin && \
            docker pull '$FRONTEND_IMAGE' && \
            cd /home/ubuntu/app/infra && \
            docker compose -f docker-compose.yml up -d"

      - name: Revoke Security Group Ingress
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.FRONTEND_SG_ID || 'sg-060d95f99ed1571f9' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

  deploy-backend-aws:
    name: Deploy Backend (AWS EC2 - NestJS)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Get Runner IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "ipv4=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Authorize Security Group Ingress
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.BACKEND_SG_ID || 'sg-0369f396ce893653a' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_HOST: ${{ secrets.EC2_HOST || '13.207.130.42' }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            cat << 'EOF_SSH' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 60
            ConnectTimeout 30
          EOF_SSH
            chmod 600 ~/.ssh/config
          fi

      - name: Pull & Deploy Backend on EC2
        if: env.SSH_PRIVATE_KEY != ''
        env:
          TARGET_HOST: ${{ secrets.EC2_HOST || '13.207.130.42' }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:latest
        run: |
          ssh ubuntu@$TARGET_HOST "mkdir -p /home/ubuntu/app/infra"
          scp infra/docker-compose.yml infra/Caddyfile ubuntu@$TARGET_HOST:/home/ubuntu/app/infra/

          # Log in to GHCR on EC2, pull image, and restart container fast
          ssh ubuntu@$TARGET_HOST "echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$REGISTRY_USER' --password-stdin && \
            docker pull '$BACKEND_IMAGE' && \
            cd /home/ubuntu/app/infra && \
            docker compose -f docker-compose.yml up -d"

      - name: Revoke Security Group Ingress
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.BACKEND_SG_ID || 'sg-0369f396ce893653a' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true
