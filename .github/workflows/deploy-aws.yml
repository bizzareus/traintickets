name: Deploy to AWS (Parallel Staging)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend-aws:
    name: Deploy Frontend (AWS EC2 - Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Get Runner IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "ipv4=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Authorize Security Group Ingress
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.FRONTEND_SG_ID || 'sg-060d95f99ed1571f9' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_HOST: ${{ secrets.FRONTEND_EC2_HOST || '13.202.107.176' }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 60
            ConnectTimeout 30
          EOF
            chmod 600 ~/.ssh/config
          fi

      - name: Sync Frontend Code & Deploy Docker Containers
        if: env.SSH_PRIVATE_KEY != ''
        env:
          TARGET_HOST: ${{ secrets.FRONTEND_EC2_HOST || '13.202.107.176' }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          ssh ubuntu@$TARGET_HOST "mkdir -p /home/ubuntu/app/infra"
          scp infra/docker-compose.frontend.yml ubuntu@$TARGET_HOST:/home/ubuntu/app/infra/docker-compose.yml
          scp infra/Caddyfile.frontend ubuntu@$TARGET_HOST:/home/ubuntu/app/infra/Caddyfile.frontend
          scp Dockerfile.frontend ubuntu@$TARGET_HOST:/home/ubuntu/app/Dockerfile.frontend
          
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'backend' \
            --exclude '.git' \
            --exclude '.claude' \
            --exclude '.agents' \
            --exclude '.gemini' \
            --exclude 'tmp' \
            --exclude '.env*' \
            ./ ubuntu@$TARGET_HOST:/home/ubuntu/app/

          ssh ubuntu@$TARGET_HOST "cd /home/ubuntu/app/infra && docker compose -f docker-compose.yml up -d --build"

      - name: Revoke Security Group Ingress
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.FRONTEND_SG_ID || 'sg-060d95f99ed1571f9' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

  deploy-backend-aws:
    name: Deploy Backend (AWS EC2 - NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Get Runner IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "ipv4=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Authorize Security Group Ingress
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.BACKEND_SG_ID || 'sg-0369f396ce893653a' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

      - name: Setup SSH Keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_HOST: ${{ secrets.EC2_HOST || '13.207.130.42' }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 60
            ConnectTimeout 30
          EOF
            chmod 600 ~/.ssh/config
          fi

      - name: Sync Backend Code & Deploy Docker Containers
        if: env.SSH_PRIVATE_KEY != ''
        env:
          TARGET_HOST: ${{ secrets.EC2_HOST || '13.207.130.42' }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          ssh ubuntu@$TARGET_HOST "mkdir -p /home/ubuntu/app/infra /home/ubuntu/app/backend && touch /home/ubuntu/app/backend/.env"
          scp infra/docker-compose.yml infra/Caddyfile ubuntu@$TARGET_HOST:/home/ubuntu/app/infra/
          
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env*' \
            ./backend/ ubuntu@$TARGET_HOST:/home/ubuntu/app/backend/

          ssh ubuntu@$TARGET_HOST "cd /home/ubuntu/app/infra && docker compose up -d --build"

      - name: Revoke Security Group Ingress
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SG_ID: ${{ secrets.BACKEND_SG_ID || 'sg-0369f396ce893653a' }}
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true
