    <rect x="548" y="1138" width="447" height="74" rx="9" fill="#355AED"/>
    <text x="772" y="1183" fill="#FFFFFF" font-size="26" text-anchor="middle" font-weight="700">Find &amp; book on LastBerth →</text>

    <!-- Disclaimers & Bio link -->
    <text x="64" y="1270" fill="#A9B8CA" font-size="21">Availability and fares from IRCTC live scan. Recheck before booking.</text>
    <text x="64" y="1305" fill="#88E2B6" font-size="21" font-weight="700">lastberth.com · Link in bio · Split tickets · Subject to live availability</text>
