    <rect x="422" y="910" width="568" height="110" rx="10" fill="#E8F8F0"/>
    <text x="442" y="948" fill="#247251" font-size="22" font-weight="700">Split Fare Total: ₹745 + ₹900 = ₹1,645</text>
    <text x="442" y="986" fill="#466A57" font-size="19">Confirmed CC berths across both legs · Same Train 12277</text>

    <!-- Summary Row -->
    <text x="64" y="1086" fill="#D6E0EB" font-size="24">2 tickets · Both in CC · Seat change at Balasore (BLS)</text>

