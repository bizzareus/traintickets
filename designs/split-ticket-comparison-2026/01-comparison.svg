<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <title>Confirmed Ticket from Howrah to Puri for 25 Nov 2026</title>
  <rect width="1080" height="1350" fill="#101B2C"/>
  <rect width="1080" height="10" fill="#355AED"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="84" fill="#FFFFFF" font-size="36" font-weight="700" letter-spacing="-1">LastBerth</text>
    <text x="1016" y="81" fill="#B2C0D0" font-size="22" text-anchor="end" letter-spacing="2">REAL SEARCH. REAL SCREENSHOTS.</text>
    <path d="M64 120H1016" stroke="#324155"/>
    <text x="64" y="166" fill="#FFBA55" font-size="22" font-weight="700" letter-spacing="2">SAME TRAIN. A DIFFERENT WAY TO BOOK.</text>
  </g>
  <g font-family="DIN Condensed, Arial Narrow, sans-serif" font-weight="700">
