    <text x="64" y="295" fill="#FFFFFF" font-size="52">FROM HOWRAH (HWH) TO PURI (PURI)</text>
    <text x="64" y="348" fill="#FFBA55" font-size="44">FOR 25 NOV 2026</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="65" y="388" fill="#E4EAF2" font-size="28" font-weight="700">SHATABDI EXP · 12277 · DEPARTS 02:15 PM</text>

    <!-- Left Card: ConfirmTkt Direct Baseline -->
    <rect x="64" y="440" width="310" height="606" rx="20" fill="#FFF4EF"/>
    <rect x="396" y="440" width="620" height="606" rx="20" fill="#F1FCF6"/>
    <rect x="64" y="464" width="5" height="62" fill="#BC5849"/>
    <rect x="396" y="464" width="5" height="62" fill="#247251"/>
    <text x="86" y="491" fill="#101B2C" font-size="33" font-weight="700">ConfirmTkt</text>
    <text x="86" y="532" fill="#795B54" font-size="23">End-to-end · CC &amp; EC</text>
    <path d="M86 557H352" stroke="#E3CBC2"/>
    <text x="86" y="600" fill="#795B54" font-size="18" letter-spacing="1">SCREENSHOT EXCERPT</text>
    <rect x="80" y="622" width="278" height="135" rx="8" fill="#FFFFFF"/>
    <image href="crops/confirmtkt-status.png" x="86" y="630" width="266" height="118" preserveAspectRatio="xMidYMid meet"/>
    <rect x="86" y="793" width="218" height="43" rx="6" fill="#F6DDD4"/>
    <text x="104" y="823" fill="#8E3F32" font-size="24" font-weight="700">WAITLISTED</text>
    <text x="86" y="886" fill="#574B48" font-size="24">One ticket for</text>
    <text x="86" y="922" fill="#574B48" font-size="24">the full route.</text>
    <text x="86" y="976" fill="#8E3F32" font-size="22" font-weight="700">CC: WL 12 · EC: WL 15</text>

    <!-- Right Card: LastBerth Split Legs -->
    <text x="422" y="488" fill="#355AED" font-size="33" font-weight="700" letter-spacing="-1">LastBerth</text>
    <text x="422" y="518" fill="#466A57" font-size="20">Available seats in split legs</text>
    <path d="M422 538H990" stroke="#C5E1D1"/>

    <!-- Leg 1 -->
    <text x="422" y="570" fill="#315A43" font-size="20" font-weight="700">01  HWH → BLS (CC · AVL 61 · ₹745)</text>
    <rect x="422" y="580" width="568" height="130" rx="8" fill="#FFFFFF"/>
    <image href="crops/lastberth-leg-1.png" x="432" y="586" width="548" height="118" preserveAspectRatio="xMidYMid meet"/>

    <!-- Leg 2 -->
    <text x="422" y="746" fill="#315A43" font-size="20" font-weight="700">02  BLS → PURI (CC · AVL 48 · ₹900)</text>
    <rect x="422" y="756" width="568" height="130" rx="8" fill="#FFFFFF"/>
    <image href="crops/lastberth-leg-2.png" x="432" y="762" width="548" height="118" preserveAspectRatio="xMidYMid meet"/>

